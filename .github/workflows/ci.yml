name: CI

on:
  push:
    branches:
      - main
      - non-prod
  pull_request:
    branches:
      - main
      - non-prod

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/roadmap_ci?schema=public
      AUTH_SECRET: ci-only-secret-that-is-long-enough-for-tests
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Type check
        run: npm run typecheck

      - name: Build application
        run: npm run build
